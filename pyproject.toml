[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scattering-quantum-walk-lab"
version = "0.1.0"
description = "Reference simulations of unitary and open scattering quantum walks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "networkx>=3.2,<4"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra"
